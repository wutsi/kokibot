name: pr

on: [ pull_request ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v6

            -   name: JDK
                uses: actions/setup-java@v5
                with:
                    distribution: 'zulu'
                    java-version: 17

            -   name: Build
                env:
                    DEEPSEEK_API_KEY: ${{secrets.DEEPSEEK_API_KEY}}
                    TELEGRAM_TOKEN: ${{secrets.TELEGRAM_TOKEN}}
                    TELEGRAM_CHATBOT: ${{secrets.TELEGRAM_CHATBOT}}
                run: |
                    mvn validate
                    mvn package
