name: release

on:
    push:
        branches:
            - release-generation

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            -   uses: actions/checkout@v6
                with:
                    fetch-depth: 0

            -   name: JDK
                uses: actions/setup-java@v5
                with:
                    distribution: 'zulu'
                    java-version: 17


            -   name: Build
                env:
                    DEEPSEEK_API_KEY: ${{secrets.DEEPSEEK_API_KEY}}
                    KIMI_API_KEY: ${{secrets.KIMI_API_KEY}}
                    TELEGRAM_TOKEN: ${{secrets.TELEGRAM_TOKEN}}
                    TELEGRAM_CHATBOT: ${{secrets.TELEGRAM_CHATBOT}}
                run: |
                    mvn validate
                    mvn install

            -   name: Extract Version
                id: version
                run: |
                    VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
                    echo "version=$VERSION" >> $GITHUB_OUTPUT

            -   name: Update version in install.sh
                run: |
                    git config user.email "actions@github.com"
                    git config user.name "GitHub Actions"
                    VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')
                    sed -i.bak "s/^KOKIBOT_VERSION=.*/KOKIBOT_VERSION=\"$VERSION\"/" install.sh
                    rm install.sh.bak
                    git add install.sh
                    git commit -m "Update KOKIBOT_VERSION in install.sh to $VERSION"
                    git push origin HEAD:master

            -   name: Generate Changelog
                id: changelog
                run: |
                    PREVIOUS_TAG=$(git tag --sort=-version:refname --list 'v*' | head -n 1)
                    if [ -z "$PREVIOUS_TAG" ]; then
                      CHANGELOG=$(git log --pretty=format:"- %h: %s" --reverse)
                    else
                      CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %h: %s")
                    fi
                    echo "changelog<<EOF" >> $GITHUB_OUTPUT
                    echo "$CHANGELOG" >> $GITHUB_OUTPUT
                    echo "EOF" >> $GITHUB_OUTPUT

            -   name: Bump Version in pom.xml
                run: |
                    git config user.email "actions@github.com"
                    git config user.name "GitHub Actions"
                    mvn versions:set -DnewVersion=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//' | awk -F. '{$NF=$NF+1; print}' OFS=.)
                    git add pom.xml
                    git commit -m "Bump version for next development iteration"
                    git push origin HEAD:master

            -   name: Create Release ZIP
                run: |
                    mkdir -p kokibot_temp
                    mkdir -p kokibot_temp/kokibot
                    cp target/*.jar kokibot_temp/kokibot/
                    cp -r install/* kokibot_temp/kokibot/
                    cd kokibot_temp
                    zip -r ../target/kokibot.zip .
                    cd ..
                    rm -rf kokibot_temp

            -   name: Create Release
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: v${{ steps.version.outputs.version }}
                    name: Release ${{ steps.version.outputs.version }}
                    body: |
                        ## Changes
                        ${{ steps.changelog.outputs.changelog }}
                    files: |
                        target/kokibot.zip
                        install.sh
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
