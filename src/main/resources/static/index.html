<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Kokibot Chat</title>
    <link href="css/chat.css" rel="stylesheet">
    <link href="css/errors.css" rel="stylesheet">
    <link href="css/notifications.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" rel="stylesheet" media="(prefers-color-scheme: light)">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" rel="stylesheet" media="(prefers-color-scheme: dark)">
</head>
<body>
<div class="app-container">
    <!-- Header -->
    <header class="chat-header">
        <div class="agent-info">
            <div class="agent-name-container">
                <h1 id="agent-name">Kokibot</h1>
                <button id="agent-selector-btn" class="agent-selector-button" title="Switch Agent">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 11L3 6h10l-5 5z"/>
                    </svg>
                </button>
            </div>
            <span id="agent-description">AI Assistant</span>
        </div>
        <div class="connection-status">
            <span class="status-dot" id="status-indicator"></span>
            <span id="status-text">Connecting...</span>
        </div>
    </header>

    <!-- Agent Selector Modal -->
    <div id="agent-selector-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Select Agent</h2>
                <button id="close-modal-btn" class="close-button">&times;</button>
            </div>
            <div id="agent-list" class="agent-list">
                <div class="agent-list-loading">Loading agents...</div>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Left Sidebar -->
        <aside id="sidebar" class="sidebar">
            <button id="sidebar-toggle" class="sidebar-toggle" title="Toggle Sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </button>
            <div class="sidebar-content">
                <nav class="sidebar-nav">
                    <button id="history-btn" class="sidebar-nav-item" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
                        </svg>
                        <span>History</span>
                    </button>
                    <button id="settings-btn" class="sidebar-nav-item">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                        </svg>
                        <span>Settings</span>
                    </button>
                </nav>
            </div>
        </aside>

        <!-- Chat Container -->
        <main class="chat-container" id="chat-container">
            <!-- Messages will be dynamically inserted here -->
        </main>
    </div>

    <!-- Input Area -->
    <footer class="input-container">
        <!-- Uploaded Files Display -->
        <div id="uploaded-files-container" class="uploaded-files-container"></div>

        <div class="input-wrapper">
            <button id="upload-button" class="upload-button" title="Upload Files">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
                </svg>
            </button>
            <input type="file" id="file-input" multiple hidden accept="*/*">
                <textarea
                    id="message-input"
                    maxlength="10000"
                    placeholder="Ask me anything..."
                    rows="1"
                ></textarea>
            <button disabled id="send-button">
                <svg height="24" viewBox="0 0 24 24" width="24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="js/errors.bundle.js"></script>
<script src="js/utils.js"></script>
<script src="js/components/notification-manager.js"></script>
<script src="js/websocket-client.js"></script>
<!-- Chat UI Components (load in dependency order) -->
<script src="js/components/message-formatter.js"></script>
<script src="js/components/markdown-renderer.js"></script>
<script src="js/components/reasoning-section.js"></script>
<script src="js/components/tool-status-badge.js"></script>
<script src="js/components/reasoning-view.js"></script>
<script src="js/components/token-display.js"></script>
<script src="js/components/copy-button.js"></script>
<script src="js/components/message-renderer.js"></script>
<script src="js/components/input-controller.js"></script>
<script src="js/components/connection-manager.js"></script>
<script src="js/components/assistant-info-loader.js"></script>
<script src="js/components/agent-selector.js"></script>
<script src="js/components/sidebar.js"></script>
<script src="js/components/file-upload.js"></script>
<!-- Main orchestrator -->
<script src="js/chat-ui.js"></script>
<script>
    // Initialize app on page load
    document.addEventListener('DOMContentLoaded', () => {
        const agentName = getAgentNameFromURL();
        ChatUI.init(agentName);
        AgentSelector.init(agentName);
        Sidebar.init();
        FileUpload.init(agentName);
    });
</script>
</body>
</html>
